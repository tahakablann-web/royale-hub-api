services:
  - type: web
    name: royale-hub-api
    runtime: node
    plan: free
    buildCommand: echo "Pure Node.js API Server"
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 4000
      - key: CR_USE_PROXY
        value: "true"
      - key: CR_API_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
